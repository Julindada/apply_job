[project]
name = "apply-job"
version = "0.1.0"
description = "LangGraph agent for job applications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.12",
    "langdetect>=1.0.9",
    "langgraph>=1.1.6",
    "langgraph-cli[inmem]>=0.4.21",
    "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apply_job"]
