services:
  apply-job:
    build: .
    entrypoint: ["sleep", "infinity"]
    environment:
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - LLM_MODEL=${LLM_MODEL:-gpt-5.5}
      - APPLY_LLM_MODEL=${APPLY_LLM_MODEL:-gpt-5.4-mini}
      - AI233_BASE_URL=${AI233_BASE_URL}
      - AI233_KEY=${AI233_KEY}
      - CDP_URL=${CDP_URL:-http://host.docker.internal:9222}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - PYTHONPATH=/app/src
    volumes:
      - ~/docker_data:/app/data

  studio:
    build: .
    entrypoint: langgraph
    command: dev --host 0.0.0.0 --port 8123
    ports:
      - "8123:8123"
    environment:
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - LLM_MODEL=${LLM_MODEL:-gpt-5.5}
      - APPLY_LLM_MODEL=${APPLY_LLM_MODEL:-gpt-5.4-mini}
      - AI233_BASE_URL=${AI233_BASE_URL}
      - AI233_KEY=${AI233_KEY}
      - CDP_URL=${CDP_URL:-http://host.docker.internal:9222}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - WATCHFILES_IGNORE_PATHS=/app/data
      - PYTHONPATH=/app/src
    volumes:
      - ~/docker_data:/app/data
      - ./src:/app/src:ro
      - ./langgraph.json:/app/langgraph.json:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
