services:
  apply-job:
    build: .
    environment:
      - DASHSCOPE_V2_API_KEY=${DASHSCOPE_V2_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - DATA_DIR=${DATA_DIR:-/app/data}
    volumes:
      - ~/docker_data:/app/data

  studio:
    build: .
    entrypoint: langgraph
    command: dev --host 0.0.0.0 --port 8123
    ports:
      - "8123:8123"
    environment:
      - DASHSCOPE_V2_API_KEY=${DASHSCOPE_V2_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - DATA_DIR=${DATA_DIR:-/app/data}
    volumes:
      - ~/docker_data:/app/data
      - ./src:/app/src:ro
      - ./langgraph.json:/app/langgraph.json:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
